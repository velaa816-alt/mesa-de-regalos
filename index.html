<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Regalos</title>
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8a704c;
            --secondary: #2c3e35;
            --bg: #f9f8f6;
            --card-bg: #ffffff;
            --text: #333333;
            --disabled: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 30px;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gift-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e0e0e0;
        }

        .gift-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .gift-card.reserved {
            background-color: #f2f2f2;
            opacity: 0.8;
        }

        .gift-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .gift-status {
            font-size: 0.9rem;
            margin-bottom: 15px;
            color: #666;
        }

        .btn-reserve {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
            width: 100%;
        }

        .btn-reserve:hover {
            background-color: #725b3d;
        }

        .btn-reserve:disabled {
            background-color: var(--disabled);
            cursor: not-allowed;
        }

        /* Estilos del Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-confirm {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Mesa de Regalos</h1>

    <!-- Contenedor principal para las tarjetas de regalos -->
    <div id="giftContainer" class="gift-grid"></div>

    <!-- Modal para ingresar el nombre -->
    <div id="reserveModal" class="modal">
        <div class="modal-content">
            <div id="modalGiftName" class="modal-title">Elegiste un regalo</div>
            <label for="guestName" style="display:block; margin-bottom: 8px; font-size: 0.9rem;">Ingresa tu nombre y apellido:</label>
            <input type="text" id="guestName" class="modal-input" placeholder="Ej. Maria Lopez" />
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button id="btnConfirm" class="btn-confirm" onclick="confirmReservation()">Reservar regalo</button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_PHONE = "51975001996";
        const API_URL = 'https://sheetdb.io/api/v1/gsi3nvdi219m2';

        // Lista de regalos con cupos definidos
        const defaultGifts = [
            {"id": 1, "name": "Olla Arrocera", "max": 1},
            {"id": 2, "name": "Plancha", "max": 1},
            {"id": 3, "name": "Licuadora", "max": 2},
            {"id": 4, "name": "Juego de ollas", "max": 2},
            {"id": 5, "name": "Tostadera", "max": 1},
            {"id": 6, "name": "Exprimidor de cítricos", "max": 1},
            {"id": 7, "name": "Microonda", "max": 1},
            {"id": 8, "name": "Sanguchera", "max": 1},
            {"id": 9, "name": "Sartén", "max": 2},
            {"id": 10, "name": "Set de Táper de vidrio", "max": 4},
            {"id": 11, "name": "Juego de tazas", "max": 2},
            {"id": 12, "name": "Juego de copas de vidrio para postres", "max": 2},
            {"id": 13, "name": "Juego de dulceras de vidrio", "max": 2},
            {"id": 14, "name": "Set de cubiertos de acero inoxidable", "max": 2},
            {"id": 15, "name": "Escurridor de acero inoxidable", "max": 1},
            {"id": 16, "name": "Termo de acero inoxidable", "max": 1},
            {"id": 17, "name": "Set de cucharones tramontina", "max": 1},
            {"id": 18, "name": "Set de bandeja de vidrio", "max": 2},
            {"id": 19, "name": "Tetera de acero inoxidable", "max": 2},
            {"id": 20, "name": "Set de dispensador y pulverizador de aceites", "max": 1},
            {"id": 21, "name": "Sábanas para cama Queen (2 plazas y media)", "max": 5},
            {"id": 22, "name": "Edredón para cama Queen (2 plazas y media)", "max": 5},
            {"id": 23, "name": "Cubrecama para cama Queen (2 plazas y media)", "max": 4},
            {"id": 24, "name": "Organizador de Zapatos", "max": 2},
            {"id": 25, "name": "Equipo de sonido portátil", "max": 2},
            {"id": 26, "name": "Silla de escritorio", "max": 2},
            {"id": 27, "name": "Juego de comedor", "max": 2},
            {"id": 28, "name": "Refrigeradora", "max": 1},
            {"id": 29, "name": "Set de Toalla de Mano", "max": 3},
            {"id": 30, "name": "Estractor", "max": 2},
            {"id": 31, "name": "Set de contenedores herméticos", "max": 2},
            {"id": 32, "name": "Condimento giratorio de madera", "max": 2},
            {"id": 33, "name": "Vajilla completa", "max": 4},
            {"id": 34, "name": "Frascos y contenedores asthetic", "max": 2},
            {"id": 35, "name": "Juego de almohadas", "max": 5},
            {"id": 36, "name": "Silla colgante tipo huevo", "max": 2},
            {"id": 37, "name": "Set de toallas de baño", "max": 5},
            {"id": 38, "name": "Organizadores de te filtrante", "max": 1},
            {"id": 39, "name": "Set de cuchillos de acero inoxidable", "max": 1},
            {"id": 40, "name": "Freidora de aire", "max": 2},
            {"id": 41, "name": "Set de organizadores para lavandería", "max": 2},
            {"id": 42, "name": "Lavadora", "max": 1},
            {"id": 43, "name": "Televisión", "max": 1},
            {"id": 44, "name": "Cocina", "max": 1},
            {"id": 45, "name": "Juego de sartenes", "max": 1},
            {"id": 46, "name": "Juego de cuchillos", "max": 1},
            {"id": 47, "name": "Juego de muebles", "max": 1},
            {"id": 48, "name": "Secadora de cabello", "max": 1},
            {"id": 49, "name": "Batidora", "max": 1},
            {"id": 50, "name": "Freidora de aire", "max": 1},
            {"id": 51, "name": "Cafetera", "max": 1},
            {"id": 52, "name": "Copas para champagne", "max": 1}
        ];

        let giftsData = [];
        let selectedGiftId = null;

        async function loadGifts() {
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`, { cache: 'no-store' });
                const sheetData = await response.json();

                giftsData = defaultGifts.map(gift => {
                    const sheetItem = sheetData.find(item => String(item.id).trim() === String(gift.id).trim());
                    return {
                        ...gift,
                        estado: sheetItem && sheetItem.estado ? String(sheetItem.estado) : 'Disponible',
                        invitado_1: sheetItem && sheetItem.invitado_1 ? String(sheetItem.invitado_1) : '',
                        invitado_2: sheetItem && sheetItem.invitado_2 ? String(sheetItem.invitado_2) : '',
                        invitado_3: sheetItem && sheetItem.invitado_3 ? String(sheetItem.invitado_3) : '',
                        invitado_4: sheetItem && sheetItem.invitado_4 ? String(sheetItem.invitado_4) : '',
                        invitado_5: sheetItem && sheetItem.invitado_5 ? String(sheetItem.invitado_5) : ''
                    };
                });
            } catch (error) {
                console.error('Error cargando SheetDB:', error);
                giftsData = defaultGifts.map(g => ({ 
                    ...g, 
                    estado: 'Disponible', 
                    invitado_1: '', 
                    invitado_2: '', 
                    invitado_3: '', 
                    invitado_4: '', 
                    invitado_5: '' 
                }));
            }

            renderGifts();
        }

        function renderGifts() {
            const container = document.getElementById('giftContainer');
            container.innerHTML = '';

            giftsData.forEach(gift => {
                let count = 0;
                if (gift.invitado_1 && gift.invitado_1.trim() !== '') count++;
                if (gift.invitado_2 && gift.invitado_2.trim() !== '') count++;
                if (gift.invitado_3 && gift.invitado_3.trim() !== '') count++;
                if (gift.invitado_4 && gift.invitado_4.trim() !== '') count++;
                if (gift.invitado_5 && gift.invitado_5.trim() !== '') count++;

                const maxCapacity = gift.max || 1;
                const isFullyReserved = count >= maxCapacity || (gift.estado && gift.estado.toLowerCase().includes('agotado'));

                let statusText = '';
                if (isFullyReserved) {
                    statusText = `<i class="fa-solid fa-circle-check" style="color: #2c3e35;"></i> Agotado (${count}/${maxCapacity})`;
                } else if (count === 0) {
                    statusText = `<i class="fa-regular fa-circle"></i> Disponible (0/${maxCapacity})`;
                } else {
                    const nombresList = [gift.invitado_1, gift.invitado_2, gift.invitado_3, gift.invitado_4, gift.invitado_5].filter(Boolean).join(', ');
                    const nombres = nombresList ? ` (${nombresList})` : '';
                    statusText = `<i class="fa-solid fa-circle-half-stroke" style="color: #8a704c;"></i> ${count}/${maxCapacity} Reservado<br><small>${nombres}</small>`;
                }

                const itemHTML = `
                    <div class="gift-card ${isFullyReserved ? 'reserved' : ''}">
                        <div class="gift-name">${gift.name}</div>
                        <div class="gift-status">${statusText}</div>
                        <button class="btn-reserve" 
                            ${isFullyReserved ? 'disabled' : ''} 
                            onclick="openModal(${gift.id})">
                            ${isFullyReserved ? 'Agotado 🔒' : 'Elegir'}
                        </button>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });
        }

        function openModal(id) {
            selectedGiftId = id;
            const gift = giftsData.find(g => String(g.id) === String(id));
            document.getElementById('modalGiftName').innerText = `Elegiste: "${gift.name}"`;
            document.getElementById('guestName').value = '';
            document.getElementById('reserveModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('reserveModal').classList.remove('active');
            selectedGiftId = null;
        }

        async function confirmReservation() {
            const nameInput = document.getElementById('guestName').value.trim();
            if (!nameInput) {
                alert('Por favor, ingresa tu nombre para reservar el regalo.');
                return;
            }

            const btnConfirm = document.getElementById('btnConfirm');
            btnConfirm.innerText = 'Guardando...';
            btnConfirm.disabled = true;

            const gift = giftsData.find(g => String(g.id) === String(selectedGiftId));
            const maxCapacity = gift.max || 1;
            let updateData = {};

            let currentCount = 0;
            if (gift.invitado_1 && gift.invitado_1.trim() !== '') currentCount++;
            if (gift.invitado_2 && gift.invitado_2.trim() !== '') currentCount++;
            if (gift.invitado_3 && gift.invitado_3.trim() !== '') currentCount++;
            if (gift.invitado_4 && gift.invitado_4.trim() !== '') currentCount++;
            if (gift.invitado_5 && gift.invitado_5.trim() !== '') currentCount++;

            if (currentCount >= maxCapacity) {
                alert('Lo sentimos, este regalo ya no tiene cupos disponibles.');
                closeModal();
                btnConfirm.innerText = 'Reservar regalo';
                btnConfirm.disabled = false;
                return;
            }

            const nextSlot = currentCount + 1;
            const newStatus = (nextSlot >= maxCapacity) ? `Agotado (${nextSlot}/${maxCapacity})` : `Reservado (${nextSlot}/${maxCapacity})`;

            if (nextSlot === 1) {
                updateData = { invitado_1: nameInput, estado: newStatus };
                gift.invitado_1 = nameInput;
            } else if (nextSlot === 2) {
                updateData = { invitado_2: nameInput, estado: newStatus };
                gift.invitado_2 = nameInput;
            } else if (nextSlot === 3) {
                updateData = { invitado_3: nameInput, estado: newStatus };
                gift.invitado_3 = nameInput;
            } else if (nextSlot === 4) {
                updateData = { invitado_4: nameInput, estado: newStatus };
                gift.invitado_4 = nameInput;
            } else if (nextSlot === 5) {
                updateData = { invitado_5: nameInput, estado: newStatus };
                gift.invitado_5 = nameInput;
            }

            gift.estado = newStatus;
            
            // Refrescar inmediatamente la vista local
            renderGifts();

            try {
                // Enviar actualización a SheetDB
                await fetch(`${API_URL}/id/${gift.id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: updateData })
                });

                closeModal();
                btnConfirm.innerText = 'Reservar regalo';
                btnConfirm.disabled = false;

                const message = `¡Hola! Soy ${nameInput}. He reservado el regalo: "${gift.name}". ¡Nos vemos pronto en la celebración! 💍✨`;
                const whatsappUrl = `https://api.whatsapp.com/send?phone=${WHATSAPP_PHONE}&text=${encodeURIComponent(message)}`;

                if (confirm(`¡Gracias ${nameInput}! Tu regalo ha sido apartado. ¿Deseas enviar la confirmación por WhatsApp a los novios?`)) {
                    window.open(whatsappUrl, '_blank');
                }

            } catch (error) {
                alert('Ocurrió un error al registrar tu reserva. Inténtalo de nuevo.');
                btnConfirm.innerText = 'Reservar regalo';
                btnConfirm.disabled = false;
                loadGifts();
            }
        }

        document.addEventListener('DOMContentLoaded', loadGifts);
    </script>
</body>
</html>
