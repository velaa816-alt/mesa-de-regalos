<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda - Hector & Yahaira</title>
    <!-- Fonts Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8a704c;
            --primary-light: #c5b396;
            --accent: #2c3e35;
            --bg-light: #faf8f5;
            --text-dark: #2d2d2d;
            --text-muted: #666666;
            --card-bg: #ffffff;
            --border-color: #e5ded4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f2ede4;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-light);
            min-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .header {
            background-color: var(--accent);
            color: #ffffff;
            text-align: center;
            padding: 50px 20px 40px;
            position: relative;
            background-image: radial-gradient(circle at center, rgba(138,112,76,0.2) 0%, transparent 70%);
        }

        .header::after {
            content: "";
            display: block;
            width: 80px;
            height: 2px;
            background-color: var(--primary-light);
            margin: 20px auto 0;
        }

        .subtitle-top {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary-light);
            margin-bottom: 12px;
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .names span {
            display: block;
            font-style: italic;
            font-size: 26px;
            color: var(--primary-light);
        }

        .date-badge {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
            color: #eae5dc;
        }

        .section-title {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: var(--accent);
            margin: 35px 20px 10px;
            position: relative;
        }

        .section-desc {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            padding: 0 25px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .gift-grid {
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gift-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .gift-card.reserved {
            background-color: #f3f3f3;
            border-color: #e0e0e0;
            opacity: 0.7;
        }

        .gift-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-status {
            font-size: 11px;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .btn-reserve {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-reserve:hover {
            background-color: var(--accent);
        }

        .btn-reserve:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dark);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            background: #eee;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-confirm {
            flex: 1;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="mobile-container">

    <div class="gift-grid" id="giftContainer"></div>

    <div class="footer-note">

</div>

</div>

    function renderGifts() {
        const container = document.getElementById('giftContainer');
        container.innerHTML = '';

        gifts.forEach(gift => {
            const isReserved = gift.reservedBy !== null;

            const itemHTML = `
                <div class="gift-card ${isReserved ? 'reserved' : ''}">
                    <div class="gift-name">${gift.name}</div>
                    <div class="gift-status">

                        onclick="openModal(${gift.id})">
                        ${isReserved ? 'Reservado' : 'Elegir'}
                    </button>
                </div>
            `;
            container.innerHTML += itemHTML;
        });
    }

    function openModal(id) {
        selectedGiftId = id;
        const gift = gifts.find(g => g.id === id);
        document.getElementById('modalGiftName').innerText = `Elegiste: "${gift.name}"`;
        document.getElementById('guestName').value = '';
        document.getElementById('reserveModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('reserveModal').classList.remove('active');
        selectedGiftId = null;
    }

    function confirmReservation() {
        const nameInput = document.getElementById('guestName').value.trim();
        if (!nameInput) {
            alert('Por favor, ingresa tu nombre para reservar el regalo.');
            return;
        }

        const gift = gifts.find(g => g.id === selectedGiftId);
        gift.reservedBy = nameInput;

        localStorage.setItem('wedding_gifts_hector_yahaira', JSON.stringify(gifts));

        renderGifts();
        closeModal();

        const message = `¡Hola! Soy ${nameInput}. He reservado el siguiente regalo para su boda: "${gift.name}". ¡Nos vemos pronto en la celebración! 💍✨`;

        setTimeout(() => {

                window.open(whatsappUrl, '_blank');
            }
        }, 300);
    }

    renderGifts();
</script>

</body>
    <script>
  const API_URL = 'https://sheetdb.io/api/v1/gsi3nvdi219m2';

  // Cargar estado de regalos al entrar a la página
  async function actualizarEstadoRegalos() {
    try {
      const response = await fetch(API_URL);
      const regalos = await response.json();

      regalos.forEach(item => {
        if (item.estado && item.estado.toLowerCase() === 'reservado') {
          // Busca botones o elementos marcados con el ID o nombre del regalo
          const boton = document.querySelector(`[data-id="${item.id}"]`) || 
                        document.querySelector(`[data-regalo="${item.regalo}"]`);
          if (boton) {
            boton.innerText = 'Reservado 🔒';
            boton.disabled = true;
            boton.classList.add('reservado');
          }
        }
      });
    } catch (error) {
      console.error('Error al cargar datos:', error);
    }
  }

  // Función para guardar cuando un invitado elige un regalo
  async function reservarRegalo(id, nombreInvitado) {
    try {
      await fetch(`${API_URL}/id/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: { estado: 'Reservado', invitado: nombreInvitado }
        })
      });
      location.reload(); // Recarga para mostrar el cambio
    } catch (error) {
      alert('Ocurrió un error al guardar la reserva.');
    }
  }

  document.addEventListener('DOMContentLoaded', actualizarEstadoRegalos);
</script>
